const TABS = {
  hf:{sub:"Every Hugging Face Space and dataset, one per line.",
      stats:`<div class="pill"><b>${hfCount}</b> Spaces</div><div class="pill"><b>1</b> Dataset</div><div class="pill"><b>2</b> Private 🔒</div>`,
      foot:'Profile: <a href="https://huggingface.co/MarkTheArtist">huggingface.co/MarkTheArtist</a>',
      groups:hfGroups,
      row:(g,[slug,o={}])=>{
        const url=`https://huggingface.co/${g.dataset?"datasets":"spaces"}/MarkTheArtist/${slug}`;
        const name=o.label||pretty(slug);
        const tags=(o.priv?`<span class="tag">🔒 Private</span>`:"")+(o.likes?`<span class="tag like">♥ ${o.likes}</span>`:"");
        return `<li data-s="${esc((name+" "+slug).toLowerCase())}"><a href="${url}" target="_blank" rel="noopener">${ICON("",HF_EMOJI[slug]||(g.dataset?"🗂️":"🐳"),name,g.color)}<span class="name">${esc(name)}<span class="slug">${esc(slug)}</span></span>${tags}<span class="arrow">↗</span></a></li>`;
      }},
  netlify:{sub:"Every working Netlify site, one per line.",
      stats:`<div class="pill"><b>${nlCount}</b> Live sites</div><div class="pill">*.netlify.app</div>`,
      foot:'Dashboard: <a href="https://app.netlify.com">app.netlify.com</a>',
      groups:nlGroups,
      row:(g,[site,name,desc,icon])=>{
        const url=`https://${site}.netlify.app/`;
        return `<li class="row" data-s="${esc((name+" "+site+" "+desc).toLowerCase())}"><a class="main" href="${url}" target="_blank" rel="noopener">${ICON(icon,"",name,g.color)}<span class="name">${esc(name)}${desc?`<span class="desc">${esc(desc)}</span>`:""}<span class="slug">${esc(site)}.netlify.app</span></span><span class="arrow">↗</span></a><a class="code" href="https://app.netlify.com/projects/${site}" target="_blank" rel="noopener">admin</a></li>`;
      }},
  github:{sub:"Every GitHub repo with a live GitHub Pages site, one per line.",
      stats:`<div class="pill"><b>${ghCount}</b> Live sites</div><div class="pill">markplaga.github.io</div>`,
      foot:'Profile: <a href="https://github.com/markplaga">github.com/markplaga</a>',
      groups:ghGroups,
      row:(g,[repo,name,desc,icon])=>{
        const url=`https://markplaga.github.io/${repo}/`;
        return `<li class="row" data-s="${esc((name+" "+repo+" "+desc).toLowerCase())}"><a class="main" href="${url}" target="_blank" rel="noopener">${ICON(icon,"",name,g.color)}<span class="name">${esc(name)}${desc?`<span class="desc">${esc(desc)}</span>`:""}<span class="slug">markplaga.github.io/${esc(repo)}</span></span><span class="arrow">↗</span></a><a class="code" href="https://github.com/markplaga/${repo}" target="_blank" rel="noopener">code</a></li>`;

let current="hf";
function render(tab){
  current = TABS[tab]?tab:"hf"; const T=TABS[current];
  document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("on",b.dataset.tab===current));
  $("sub").textContent=T.sub; $("stats").innerHTML=T.stats; $("foot").innerHTML=T.foot;
  $("q").value="";
  $("nav").innerHTML=T.groups.map(g=>`<a href="#${current}" data-jump="${g.id}"><i style="background:${g.color}"></i>${g.title}</a>`).join("");
  $("main").innerHTML=T.groups.map(g=>`<section id="${g.id}" style="--accent:${g.color}"><div class="sec-head"><span class="emoji">${g.emoji}</span><h2>${g.title}</h2><span class="count">${g.items.length}</span></div><ul>${g.items.map(it=>T.row(g,it)).join("")}</ul></section>`).join("");
  $("empty").style.display="none";
}
document.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>{ if(location.hash!=="#"+b.dataset.tab) location.hash=b.dataset.tab; else render(b.dataset.tab); }));
$("nav").addEventListener("click",e=>{const a=e.target.closest("a[data-jump]"); if(!a)return; e.preventDefault(); document.getElementById(a.dataset.jump).scrollIntoView({behavior:"smooth",block:"start"});});
window.addEventListener("hashchange",()=>render(location.hash.slice(1)));
render(location.hash.slice(1)||"hf");
const SRC={hf:"🤗 Hugging Face",github:"🐙 GitHub",netlify:"◆ Netlify"};
const keyOf=(tab,g,it)=> tab==="hf" ? ((it[1]&&it[1].label)||pretty(it[0]))+" "+it[0] : it[1]+" "+it[0]+" "+(it[2]||"");
const reEsc=t=>t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
const matches=(text,q)=>q.split(/\s+/).filter(Boolean).every(w=>new RegExp("(^|[^a-z0-9])"+reEsc(w)).test(text.replace(/-/g," ")));
function searchAll(q){
  let total=0, html="", nav="";
  for(const tab of ["hf","github","netlify"]){
    const T=TABS[tab];
    for(const g of T.groups){
      const hits=g.items.filter(it=>matches(keyOf(tab,g,it).toLowerCase(),q));
      if(!hits.length) continue;
      total+=hits.length;
      const id="s-"+g.id;
      nav+=`<a href="#${current}" data-jump="${id}"><i style="background:${g.color}"></i>${SRC[tab].split(" ")[0]} ${g.title}</a>`;
      html+=`<section id="${id}" style="--accent:${g.color}"><div class="sec-head"><span class="emoji">${g.emoji}</span><h2>${g.title}</h2><span class="src">${SRC[tab]}</span><span class="count">${hits.length}</span></div><ul>${hits.map(it=>T.row(g,it)).join("")}</ul></section>`;
    }
  }
  $("main").innerHTML=html; $("nav").innerHTML=nav;
  $("stats").innerHTML=`<div class="pill"><b>${total}</b> match${total===1?"":"es"} across all three</div>`;
  $("sub").textContent="Searching Hugging Face, GitHub Pages and Netlify together.";
  document.querySelectorAll(".tab").forEach(b=>b.classList.remove("on"));
  $("empty").style.display=total?"none":"block";
}
$("q").addEventListener("input",e=>{
  const q=e.target.value.trim().toLowerCase();
  if(!q){ const v=""; render(current); return; }
  searchAll(q);
});

<script>
// PWA-UPDATE-SYSTEM v2: auto-update, version banner, Check for updates. Do not remove this line.
const APP_RELEASE='1.0.0-20261126-1';
const APP_VERSION='1.0.0';
(function(){
  var LATER_KEY = 'mark-plaga-github-websites-update-later-v2';
  var BC_NAME = 'mark-plaga-github-websites-update-v2';

  document.getElementById('appVersion').textContent = APP_VERSION;
  var status = document.getElementById('updateStatus'), checkBtn = document.getElementById('checkUpdates'), bar = document.getElementById('updateBar');

  var tabId = 'tab-' + Math.random().toString(36).slice(2) + Date.now().toString(36);

  // Unsaved work: there is none to protect. This hub saves nothing —
  // no localStorage, sessionStorage or IndexedDB anywhere, and no
  // persist/save function. The only in-memory state is the search box
  // text (transient, retyped in seconds) and the selected tab, which
  // lives in location.hash and survives a reload. So this tab is
  // never dirty, and neither is any other tab of this app.

      var id = 'q-' + Math.random().toString(36).slice(2) + Date.now().toString(36);
      var answers = [];

    var later = null;

    if (later && release && later === release && !manual) return;

      .then(function(info){ remote = (info && typeof info.release === 'string') ? info : null; return remote; })

          else say('You have the latest version (' + APP_VERSION + ').');
        }
        return false;
      }
      return workerVersion(w, 2000).then(function(verified){
        if (verified) {

            return false;

          showBar(verified.displayVersion, verified.release, manual);
          if (manual) say('An update is ready.');
          return true;

        // Handshake failed: show the banner, but name no version.
        showBar(null, info && info.release, manual);
        if (manual) say('An update is ready.');

    if (checkPromise) return checkPromise;

      checkPromise = null;
      if (manual) checkBtn.disabled = false;

      var expected = pendingRelease || (remote && remote.release);

      // so there is nothing to save before activating.
      // 2. Coordinate with other tabs of this app.
      say('Checking other tabs\u2026');

        return;
      }

        var count = await workerClientCount(w);
        if (count === null || count > 1) {
          say('Another Workshop tab is open and couldn\u2019t confirm it\u2019s safe.');
          return;
        }
      }
      // 3. Activate only the specific waiting worker.
      say('Updating\u2026');
      userAsked = true;
      verifying = true;
      var changed = waitControllerChange(8000);
      w.postMessage({ type: 'SKIP_WAITING' });
      var ok = await changed;
      verifying = false;
      if (!ok) {
        userAsked = false;
        say('The update did not start. Tap Update now to try again, or Later to defer it.');
        return;
      }

      // then reload exactly once. No blind reload fallback exists.
      var info = await workerVersion(navigator.serviceWorker.controller, 2000);

        say('The update did not take over as expected. Tap Update now to try again, or Later to defer it.');
        return;
      }
      if (reloading) return;
      reloading = true;
      location.reload();
    } finally { updating = false; }
  }

  document.getElementById('updateNow').onclick = applyUpdate;
  document.getElementById('updateLater').onclick = function(){
    bar.hidden = true;
    try { sessionStorage.setItem(LATER_KEY, pendingRelease || (remote && remote.release) || '?'); } catch (e) {}
    say('Update postponed. You will be asked again next time you open the app, or tap Check for updates.');

  checkBtn.onclick = function(){ check(true); };
  // A controllerchange on its own (first install, or an update
  // activated from another tab) never reloads this page: only an

  // applyUpdate. There is deliberately no reload here.
  window.addEventListener('load', async function(){
    try { reg = await navigator.serviceWorker.register('sw.js', { updateViaCache: 'none', scope: './' }); } catch (e) { return; }

    check(false);
  });

  document.addEventListener('visibilitychange', function(){
    if (document.visibilityState === 'visible' && Date.now() - last > 5 * 60e3) { last = Date.now(); check(false); }

    if (document.visibilityState === 'visible') { last = Date.now(); check(false); }
